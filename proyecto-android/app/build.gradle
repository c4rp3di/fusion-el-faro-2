plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.vigia.faro'
    compileSdk 34

    defaultConfig {
        applicationId "com.vigia.faro"
        // 26: Process.waitFor(timeout) y varias APIs de red de Android 8.
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "v4.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Núcleo de la suite (expone con «api» Material, corrutinas y AndroidX).
    implementation project(':vigia-core')

    // Ya llegan con «api»; se repiten para que el diagnóstico de Fusión las vea.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Modo avanzado (ADB inalámbrico en este mismo teléfono). Versiones fijadas: son las que usa Vigía y están compiladas.
    implementation 'com.github.MuntashirAkon:libadb-android:1.0.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
